<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refeed</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!--
  Refeed for the browser: the same player as the Mac app. Plays a signed video
  with nothing on screen except a time dial, a speed dial and a mirror toggle,
  for a phone's front camera (Pixel SL2T) to read. Open it in Safari or Chrome.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 13px/1.3 system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  body.idle, body.idle * { cursor: none !important; }

  /* Video: sized by JS to fit, then slid to the left edge, centre or right edge. */
  #stage { position: fixed; inset: 0; }
  video { position: absolute; top: 50%; left: 50%; display: none;
    transform: translate(calc(-50% + var(--x, 0px)), -50%) scaleX(var(--m, 1));
    transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  video.dragging { transition: none; }
  body.loaded video { display: block; }

  /* Drop card: a 440 x 260 invitation in the middle. The whole window takes the drop. */
  #drop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(440px, calc(100vw - 48px)); height: min(260px, calc(100vh - 68px));
    border: 1.5px dashed rgba(255,255,255,.2); border-radius: 16px;
    display: grid; place-items: center; transition: border-color .15s, background .15s; }
  #drop.over { border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.04); }
  #drop .in { display: grid; justify-items: center; text-align: center; }
  #drop svg { width: 22px; height: 28px; stroke: rgba(255,255,255,.45); transition: stroke .15s; }
  #drop.over svg { stroke: #abff5a; }
  #drop .title { margin: 12px 0 16px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); }
  #drop button { height: 28px; min-width: 120px; padding: 0 14px; border: 0; border-radius: 7px; cursor: pointer;
    font: 500 13px system-ui, -apple-system, sans-serif; color: rgba(255,255,255,.9);
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); transition: background .15s; }
  #drop button:hover { background: rgba(255,255,255,.15); }
  #drop button:active { background: rgba(255,255,255,.2); }
  body.loaded #drop { display: none; }

  /* Edge glow: a spinning conic gradient in VasavanOS colours, masked so it only
     seeps in from the window's edges. Rises while a file is over the window,
     pulses once when a video loads. */
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --a: -360deg; } }
  #glow { position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0;
    transition: opacity .35s ease-in-out;
    background: conic-gradient(from var(--a), #abff5a, #80d8e8, #ffc0ff, #abff5a, #80d8e8, #ffc0ff, #abff5a);
    animation: spin 5s linear infinite;
    -webkit-mask: linear-gradient(to right, #000, rgba(0,0,0,.55) 18px, rgba(0,0,0,.18) 48px, transparent 96px,
        transparent calc(100% - 96px), rgba(0,0,0,.18) calc(100% - 48px), rgba(0,0,0,.55) calc(100% - 18px), #000),
      linear-gradient(to bottom, #000, rgba(0,0,0,.55) 18px, rgba(0,0,0,.18) 48px, transparent 96px,
        transparent calc(100% - 96px), rgba(0,0,0,.18) calc(100% - 48px), rgba(0,0,0,.55) calc(100% - 18px), #000);
    mask: linear-gradient(to right, #000, rgba(0,0,0,.55) 18px, rgba(0,0,0,.18) 48px, transparent 96px,
        transparent calc(100% - 96px), rgba(0,0,0,.18) calc(100% - 48px), rgba(0,0,0,.55) calc(100% - 18px), #000),
      linear-gradient(to bottom, #000, rgba(0,0,0,.55) 18px, rgba(0,0,0,.18) 48px, transparent 96px,
        transparent calc(100% - 96px), rgba(0,0,0,.18) calc(100% - 48px), rgba(0,0,0,.55) calc(100% - 18px), #000); }
  #glow.on { opacity: .85; transition-duration: .25s; }

  /* Controls: one column of DialKit controls on the edge the video isn't on. */
  #controls { position: fixed; top: 50%; right: 16px; transform: translateY(-50%);
    display: none; flex-direction: column; gap: 8px; transition: opacity .2s; }
  body.loaded #controls { display: flex; }
  #controls.left { right: auto; left: 16px; }
  #controls.dim { opacity: .3; transition: opacity .4s; }
  #controls.hide { opacity: 0; transition: opacity .12s; }

  .dial { position: relative; width: 40px; height: max(80px, min(200px, calc((80vh - 56px) / 2)));
    border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.05); cursor: pointer; touch-action: none; }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.11);
    transition: height .18s cubic-bezier(.2, .8, .2, 1), background .15s; }
  .handle { position: absolute; left: 10px; width: 20px; height: 3px; border-radius: 1.5px; background: rgba(255,255,255,.95);
    transition: bottom .18s cubic-bezier(.2, .8, .2, 1); }
  .dial.instant .fill, .dial.instant .handle { transition: background .15s; }
  .mark { position: absolute; left: 16px; width: 8px; height: 1px; border-radius: .5px; background: rgba(255,255,255,0); transition: background .2s; }
  .value { position: absolute; top: 10px; left: 0; right: 0; text-align: center;
    font: 500 11px/16px ui-monospace, "SF Mono", monospace; color: rgba(255,255,255,.7); transition: color .15s; }
  .dial.active .fill { background: rgba(255,255,255,.15); }
  .dial.active .mark { background: rgba(255,255,255,.15); }
  .dial.active .value { color: #fff; }

  #mirror { width: 40px; height: 40px; border-radius: 8px; border: 0; padding: 0; display: grid; place-items: center;
    background: rgba(255,255,255,.05); cursor: pointer; }
  #mirror svg { width: 16px; height: 16px; stroke: rgba(255,255,255,.7); }
  #mirror.on { background: rgba(255,255,255,.15); }
  #mirror.on svg { stroke: #fff; }
</style>
</head>
<body>

<div id="stage"><video id="v" playsinline loop></video></div>

<div id="drop">
  <div class="in">
    <svg viewBox="0 0 22 28" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 8V5a4 4 0 0 1 4-4h3M21 8V5a4 4 0 0 0-4-4h-3M1 20v3a4 4 0 0 0 4 4h3M21 20v3a4 4 0 0 1-4 4h-3"/>
    </svg>
    <div class="title">Drag and drop a video</div>
    <button id="select">Select Video</button>
  </div>
</div>
<input id="file" type="file" accept="video/*" hidden>

<div id="controls">
  <div class="dial" id="time"></div>
  <div class="dial" id="speed"></div>
  <!-- Lucide square-centerline-dashed-horizontal (ISC) -->
  <button id="mirror" title="Mirror (M)" aria-label="Mirror">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/>
      <path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/>
    </svg>
  </button>
</div>

<div id="glow"></div>

<script>
const $ = (id) => document.getElementById(id);
const v = $("v"), controls = $("controls"), glow = $("glow");

const MIN = 0.25, MAX = 3, STEP = 0.25;
let speed = +(localStorage.getItem("refeed.speed") || 1);
let mirror = localStorage.getItem("refeed.mirror") === "1";
let align = +(localStorage.getItem("refeed.align") || 0); // -1 left, 0 centre, 1 right
let url = null, dragX = null, down = null;

const speedLabel = (s) => String(s).replace(/^0\./, ".") + "×";
const timeLabel = (t) => { const s = Math.max(0, Math.floor(t)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

// ---- Dial: a vertical DialKit slider. The owner sets its fill and label;
// a drag reports a fraction, 0 at the bottom.

function makeDial(el, onScrub) {
  el.innerHTML = '<div class="fill"></div><div class="handle"></div><div class="value"></div>';
  const fill = el.querySelector(".fill"), handle = el.querySelector(".handle"), value = el.querySelector(".value");
  let marks = [], hover = false, drag = false, frac = 0;
  const active = () => el.classList.toggle("active", hover || drag);
  const at = (y) => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (r.bottom - y) / r.height)); };
  el.addEventListener("pointerenter", () => { hover = true; active(); });
  el.addEventListener("pointerleave", () => { hover = false; active(); });
  el.addEventListener("pointerdown", (e) => { e.stopPropagation(); drag = true; active(); el.setPointerCapture(e.pointerId); onScrub(at(e.clientY)); });
  el.addEventListener("pointermove", (e) => { if (drag) onScrub(at(e.clientY)); });
  el.addEventListener("pointerup", () => { drag = false; active(); });
  return {
    set(f, text) {
      frac = Math.min(1, Math.max(0, f));
      const h = el.clientHeight;
      fill.style.height = frac * 100 + "%";
      handle.style.bottom = Math.min(h - 9, Math.max(6, frac * h - 7)) + "px";
      value.textContent = text;
    },
    marks(fracs) {
      marks.forEach((m) => m.remove());
      marks = fracs.map((f) => {
        const m = document.createElement("div");
        m.className = "mark";
        m.style.bottom = f * 100 + "%";
        el.insertBefore(m, handle);
        return m;
      });
    },
  };
}

const speedDial = makeDial($("speed"), (f) => setSpeed(MIN + f * (MAX - MIN)));
const count = Math.round((MAX - MIN) / STEP);
speedDial.marks(Array.from({ length: count - 1 }, (_, i) => (i + 1) / count));

const timeDial = makeDial($("time"), (f) => {
  if (!v.duration) return;
  v.currentTime = f * v.duration;
  timeDial.set(f, timeLabel(v.currentTime));
  wake();
});
$("time").classList.add("instant"); // follows playback frame by frame

let markedDuration = 0;
(function tick() {
  const d = v.duration;
  if (d && isFinite(d)) {
    timeDial.set(v.currentTime / d, timeLabel(v.currentTime));
    if (markedDuration !== d) {
      // The smallest interval that gives at most 12 hashmarks.
      markedDuration = d;
      const every = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800].find((e) => d / e <= 12) || 3600;
      const fracs = [];
      for (let t = every; t < d; t += every) fracs.push(t / d);
      timeDial.marks(fracs);
    }
  }
  requestAnimationFrame(tick);
})();

// ---- Layout

function fitted() {
  const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
  const k = Math.min(innerWidth / vw, innerHeight / vh);
  return { w: vw * k, h: vh * k };
}
// How far the video can travel from centre before it touches an edge.
const slack = () => Math.max(0, (innerWidth - fitted().w) / 2);

function layoutVideo() {
  const { w, h } = fitted();
  v.style.width = w + "px";
  v.style.height = h + "px";
  v.style.setProperty("--x", (dragX ?? align * slack()) + "px");
  v.style.setProperty("--m", mirror ? -1 : 1);
}
addEventListener("resize", () => { layoutVideo(); setSpeed(speed, false); });
v.addEventListener("loadedmetadata", () => { v.playbackRate = speed; layoutVideo(); });

// ---- State

function setSpeed(s, poke = true) {
  speed = Math.min(MAX, Math.max(MIN, Math.round(s / STEP) * STEP));
  v.playbackRate = speed;
  v.defaultPlaybackRate = speed;
  localStorage.setItem("refeed.speed", speed);
  speedDial.set((speed - MIN) / (MAX - MIN), speedLabel(speed));
  if (poke) wake();
}

function setMirror(on) {
  mirror = on;
  $("mirror").classList.toggle("on", on);
  localStorage.setItem("refeed.mirror", on ? "1" : "0");
  layoutVideo();
  wake();
}

// The controls sit on the edge the video isn't on; right when centred.
function setAlign(a, animate = true) {
  const left = a === 1;
  const sideChanges = left !== controls.classList.contains("left");
  align = a;
  localStorage.setItem("refeed.align", a);
  layoutVideo();
  if (!sideChanges) return wake();
  if (!animate) { controls.classList.toggle("left", left); return; }
  controls.classList.add("hide");
  setTimeout(() => {
    controls.classList.toggle("left", left);
    controls.classList.remove("hide");
    wake();
  }, 120);
}

const toggle = () => { if (!v.src) return; v.paused ? v.play() : v.pause(); wake(); };
const fullscreen = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

// Controls dim to 30% after 2 s of untouched playback, and the pointer hides.
let idle = null;
function wake() {
  controls.classList.remove("dim");
  document.body.classList.remove("idle");
  clearTimeout(idle);
  idle = setTimeout(() => {
    if (v.paused) return;
    controls.classList.add("dim");
    document.body.classList.add("idle");
  }, 2000);
}
addEventListener("pointermove", wake);
v.addEventListener("play", wake);
v.addEventListener("pause", wake);

// ---- Glow

let glowTimer = null;
function glowShow() { clearTimeout(glowTimer); glow.style.transitionDuration = ""; glow.classList.add("on"); }
function glowHide() { clearTimeout(glowTimer); glow.style.transitionDuration = ""; glow.classList.remove("on"); }
// A file arrived: flare, hold a beat, fade.
function glowPulse() {
  clearTimeout(glowTimer);
  glow.style.transitionDuration = ".15s";
  glow.classList.add("on");
  glowTimer = setTimeout(() => { glow.style.transitionDuration = "1.1s"; glow.classList.remove("on"); }, 600);
}

// ---- Loading: drop anywhere in the window, or Select Video.

function load(file) {
  if (!file || !file.type.startsWith("video/")) return;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(file);
  v.src = url;
  markedDuration = 0;
  document.title = "Refeed · " + file.name;
  document.body.classList.add("loaded");
  setSpeed(speed, false);
  timeDial.set(0, timeLabel(0));
  glowPulse();
  wake();
}
$("select").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { load(e.target.files[0]); e.target.value = ""; });
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); if (dragDepth++ === 0) { $("drop").classList.add("over"); glowShow(); } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("dragleave", () => { if (--dragDepth === 0) { $("drop").classList.remove("over"); glowHide(); } });
addEventListener("drop", (e) => {
  e.preventDefault();
  dragDepth = 0;
  $("drop").classList.remove("over");
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith("video/")) load(file); else glowHide();
});

// ---- Mirror and scrubbing

$("mirror").addEventListener("pointerdown", (e) => e.stopPropagation());
$("mirror").addEventListener("click", () => setMirror(!mirror));

// Scroll scrubs, QuickTime style: a two-finger swipe to the right goes
// forward, to the left goes back. A mouse wheel scrubs too (down = forward).
// Seeks land a moment later, so a burst of scrolls builds on its own target.
let scrubTarget = 0, lastScrub = 0;
addEventListener("wheel", (e) => {
  if (!v.src || !v.duration) return;
  e.preventDefault();
  const dx = -e.deltaX, dy = e.deltaY; // fingers right = forward; page down = forward
  let d = Math.abs(dx) >= Math.abs(dy) ? dx : dy;
  // Pixel deltas (trackpads, most wheels): 25 px per second of video. Line deltas: 1 s per line.
  d *= e.deltaMode === 0 ? 0.04 : 1;
  const now = performance.now();
  const base = now - lastScrub < 300 ? scrubTarget : v.currentTime;
  scrubTarget = Math.min(v.duration, Math.max(0, base + d));
  lastScrub = now;
  v.currentTime = scrubTarget;
  timeDial.set(scrubTarget / v.duration, timeLabel(scrubTarget));
  wake();
}, { passive: false });

// ---- Stage: click to play, double-click for full screen, drag sideways to move the video

const stage = $("stage");
let clickTimer = null;
stage.addEventListener("pointerdown", (e) => {
  if (!v.src) return;
  down = { x: e.clientX, base: align * slack() };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!down) return;
  const dx = e.clientX - down.x;
  if (dragX === null && Math.abs(dx) < 4) return;
  const s = slack();
  dragX = Math.max(-s, Math.min(s, down.base + dx));
  v.classList.add("dragging");
  layoutVideo();
});
stage.addEventListener("pointerup", (e) => {
  if (!down) return;
  down = null;
  if (dragX !== null) {
    const s = slack(), o = dragX;
    dragX = null;
    v.classList.remove("dragging");
    setAlign(s < 1 ? 0 : o < -s / 3 ? -1 : o > s / 3 ? 1 : 0);
    return;
  }
  if (e.detail >= 2) { clearTimeout(clickTimer); fullscreen(); }
  else clickTimer = setTimeout(toggle, 250);
});

// ---- Keys

addEventListener("keydown", (e) => {
  if (!v.src) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); toggle(); }
  else if (k === "ArrowUp") { e.preventDefault(); setSpeed(speed + STEP); }
  else if (k === "ArrowDown") { e.preventDefault(); setSpeed(speed - STEP); }
  else if (k === "ArrowLeft") v.currentTime = Math.max(0, v.currentTime - 2);
  else if (k === "ArrowRight") v.currentTime += 2;
  else if (k === "m" || k === "M") setMirror(!mirror);
  else if (k === "f" || k === "F") fullscreen();
  else if (k === "0") v.currentTime = 0;
  else if (k === "[") setAlign(Math.max(-1, align - 1));
  else if (k === "]") setAlign(Math.min(1, align + 1));
});

setMirror(mirror);
setAlign(align, false);
setSpeed(speed, false);
</script>
</body>
</html>
